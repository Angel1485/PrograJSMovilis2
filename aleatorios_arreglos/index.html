<head>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;

        #divTable {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }

            border-collapse: collapse;
            width: 300px;
        }

            border: 1px solid black;

    <input type="number" id="txtTamaño" min="5" max="20">
    <button onclick="generarAleatorios()">Generar Números</button>
    <div id="divTable">

    </div>
    <script src="utilitarios.js"></script>
