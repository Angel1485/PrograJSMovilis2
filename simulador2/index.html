<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sistema de Créditos</title>
</head>
<body>

<header>
  <h1>Sistema Básico de Créditos</h1>
   <link rel="stylesheet" href="simulador_completo.css">
</header>

<nav>
  <button id="btnParametros">Parámetros</button>
  <button id="btnClientes">Clientes</button>
  <button id="btnCreditos">Créditos</button>
</nav>

<section id="parametros">
  <h2>Configurar Parámetros</h2>

  <label>Tasa de interés:</label>
  <input type="number" id="tasaInteres" min="10" max="20" value="15">
  <span>%</span>

  <br>
  <button id="btnGuardarTasa">Guardar tasa</button>

  <p id="mensajeTasa"></p>
</section>

<section id="clientes">
  <h2>Registro de Clientes</h2>

  <input type="text" id="cedula" placeholder="Cédula">
  <input type="text" id="nombre" placeholder="Nombre">
  <input type="text" id="apellido" placeholder="Apellido">
  <input type="number" id="ingresos" placeholder="Ingresos">
  <input type="number" id="egresos" placeholder="Egresos">

  <br>
  <!-- Difernetes metodos de invocar una funcion para los botones -->
  <button id="btnGuardarCliente">Guardar cliente</button>
  <button id="btnLimpiar" onclick="limpiarFormulario()">Limpiar</button>

  <table>
    <thead>
      <tr>
        <th>Cédula</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Ingresos</th>
        <th>Egresos</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tablaClientes">
       <tr>
          <td>1712345678</td>
          <td>Juan</td>
          <td>Pérez</td>
          <td>1200</td>
          <td>500</td>
          <td>
            <button>Actualizar</button>
            <button>Eliminar</button>
          </td>
        </tr>
        <tr>
          <td>1723456789</td>
          <td>María</td>
          <td>Gómez</td>
          <td>1500</td>
          <td>600</td>
          <td>
            <button>Actualizar</button>
            <button>Eliminar</button>
          </td>
        </tr>
        <tr>
          <td>1734567890</td>
          <td>Carlos</td>
          <td>Ramírez</td>
          <td>900</td>
          <td>350</td>
          <td>
            <button>Actualizar</button>
            <button>Eliminar</button>
          </td>
        </tr>
    </tbody>
  </table>
</section>

<!-- SECCIÓN CRÉDITOS -->
<section id="seccionCreditos">
    <h2>Créditos</h2>

    <label for="txtCedula">Cédula:</label>
    <input type="text" id="txtCedula">
    <button onclick="buscarClienteCredito()">Buscar Cliente</button>
    <button onclick="limpiarCreditos()">Limpiar</button>

    <div id="datosClienteCredito"></div>

    <h3>Solicitud de Crédito</h3>
    <label for="txtMontoCredito">Monto:</label>
    <input type="text" id="txtMontoCredito">

    <label for="txtPlazoCredito">Plazo (años):</label>
    <input type="text" id="txtPlazoCredito">

    <button onclick="calcularCreditoCliente()">Calular Crédito</button>

    <div id="resultadoCredito"></div>
</section>


<script src="simulador_completo.js"></script>
<script src="utilitarios.js"></script>

</body>
</html>
